<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Credenciales</title>
    <link rel="stylesheet" href="styles.css"> <!-- Archivo CSS -->
    <script src="js/qrcode.min.js"></script> <!-- Biblioteca QR -->
    <script src="script.js" defer></script> <!-- Archivo JS -->
</head>
<body>
    <header>
        <h1>Casa Tres Aguas © 2025</h1>
    </header>
    <main>
        <section class="card">
            <h2>Generar Credenciales Individualmente</h2>
            <div class="form-group">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" placeholder="Ingresa el nombre completo">
            </div>
            <div class="form-group">
                <label for="puesto">Puesto:</label>
                <input type="text" id="puesto" placeholder="Ingresa el puesto">
            </div>
            <div class="form-group">
                <label for="nss">NSS (Número de Seguridad Social):</label>
                <input type="text" id="nss" placeholder="Ingresa el NSS">
            </div>
            <div class="form-group">
                <label for="fechaNacimiento">Fecha de Nacimiento:</label>
                <input type="date" id="fechaNacimiento">
            </div>
           <div class="form-group">
                    <label for="empresa">Empresa:</label>
                    <input type="text" id="empresa" list="listaEmpresas" placeholder="Selecciona o escribe la empresa" autocomplete="off">
                    <datalist id="listaEmpresas">
                        <option value="Elemento Arquitectura Interior"></option>
                        <option value="Oro Construcciones"></option>
                    </datalist>
                </div>
            <div class="form-group">
                <label for="tipoSangre">Tipo de Sangre:</label>
                <input type="text" id="tipoSangre" placeholder="Ej. O+, A-, AB+">
            </div>
            <div class="form-group">
                <label for="contactoNombre">Nombre del Contacto de Emergencia:</label>
                <input type="text" id="contactoNombre" placeholder="Nombre completo del contacto">
            </div>
            <div class="form-group">
                <label for="contactoTelefono">Teléfono de Emergencia:</label>
                <input type="tel" id="contactoTelefono" placeholder="Ej. 55 1234 5678">
            </div>
            <div class="form-group">
                <label for="codigoQR">Código QR (Dar click para generar):</label>
                <input type="text" id="codigoQR" placeholder="Ingresa el código QR">
            </div>

            <!-- Botones agrupados por sección -->
            <div class="acciones">
                <div class="accion-seccion">
                    <h3 class="seccion-titulo">Código QR</h3>
                    <button id="generarQR" class="btn btn-primary">1. Generar QR</button>
                </div>

                <div class="accion-seccion">
                    <h3 class="seccion-titulo">Foto (opcional)</h3>
                    <div class="btn-fila">
                        <button id="cargarFotoArchivo" class="btn btn-secondary">Cargar Foto Archivo</button>
                        <button id="cargarFotoCamara" class="btn btn-secondary">Cargar Foto Cámara</button>
                    </div>
                </div>

                <div class="accion-seccion">
                    <h3 class="seccion-titulo">Credencial</h3>
                    <button id="generarCredencial" class="btn btn-secondary">2. Generar Credencial</button>
                    <button id="autorizarDescargar" class="btn btn-success">3. Descargar Parte Frontal</button>
                    <button id="descargarParteTrasera" class="btn btn-secondary">4. Descargar Parte Trasera</button>
                </div>

                <div class="accion-seccion">
                    <h3 class="seccion-titulo">Registro</h3>
                    <button id="registrarTrabajador" class="btn btn-secondary">5. Registrar Trabajador</button>
                </div>
            </div>

<!-- Contenedores para visualización -->
<div id="imagenQRPreview" class="preview-container">
    <canvas id="qrCanvas" class="preview-box"></canvas>
</div>
<div id="fotoPreview" class="preview-container">
    <canvas id="fotoCanvas" class="preview-box"></canvas>
</div>

<canvas id="credencialCanvas" class="credencial-preview"></canvas>

        </section>

        <p id="status">Por favor, llena los datos para continuar.</p>
    </main>
    <footer>
        <p>© 2025 Casa Tres Aguas</p>
    </footer>
</body>
</html>
